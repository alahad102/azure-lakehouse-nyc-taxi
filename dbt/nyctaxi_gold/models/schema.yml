version: 2

models:
  - name: dim_date
    description: "Date dimension. Range derived from silver_trips, not hardcoded."
    columns:
      - name: date_key
        description: "YYYYMMDD integer surrogate key"
        tests:
          - unique
          - not_null
      - name: full_date
        tests:
          - not_null
      - name: is_weekend
        tests:
          - accepted_values:
              arguments:
                values: [true, false]

  - name: dim_location
    description: "NYC TLC taxi zones, plus an Unknown member (-1) for unmatched IDs."
    columns:
      - name: location_key
        tests:
          - unique
          - not_null
      - name: borough
        tests:
          - not_null
      - name: zone_name
        tests:
          - not_null

  - name: dim_vendor
    description: "Vendors present in the data, named from the TLC data dictionary."
    columns:
      - name: vendor_key
        tests:
          - unique
          - not_null
      - name: vendor_name
        tests:
          - not_null

  - name: fct_trips
    description: "One row per trip. Reversals retained and flagged, not filtered."
    columns:
      - name: pickup_date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: pu_location_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key

      - name: do_location_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_key

      - name: vendor_key
        description: Natural key. Points to the static dim_vendor.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vendor')
                field: vendor_key

      - name: vendor_version_key
        description: >
          Surrogate key resolved by point-in-time join to dim_vendor_scd2.
          Identifies which vendor contract version was in effect at pickup time.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_vendor_scd2')
                field: vendor_sk

      - name: service_type

      - name: service_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['yellow', 'green']

      - name: total_amount
        tests:
          - not_null

      - name: trip_distance
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false



  - name: dim_vendor_scd2
    description: >
      SCD Type 2 vendor dimension. One row per vendor per contract-tier version.
      Tier changes were engineered (see seeds/vendor_master.csv commit history);
      TLC source data contains no slowly-changing vendor attribute.
    columns:
      - name: vendor_sk
        description: Surrogate key, unique per version (not per vendor).
        tests:
          - unique
          - not_null
      - name: vendor_id
        description: Natural key. Deliberately NOT unique — repeats across versions.
        tests:
          - not_null
      - name: contract_tier
        tests:
          - accepted_values:
              arguments:
                values: ['Standard', 'Premium']
      - name: effective_start_date
        tests:
          - not_null
      - name: effective_end_date
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null